# Gera o instalador e publica o release quando uma tag "v*" é enviada:
#   git tag -a v1.9.0 -m "Novidades desta versão"
#   git push origin v1.9.0
#
# O release é publicado neste mesmo repositório (público), que é onde o app
# consulta se há versão nova (libs/updater.py -> UPDATE_REPO).

name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Conferir versao (tag x libs/__init__.py)
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}".TrimStart('v', 'V')
          $match = Select-String -Path libs/__init__.py -Pattern "^__version_info__\s*=\s*\(([^)]+)\)"
          $ver = ($match.Matches[0].Groups[1].Value -replace "[\s'`"]", "") -replace ",", "."
          if ($tag -ne $ver) {
            throw "A tag ($tag) nao bate com __version_info__ em libs/__init__.py ($ver). Atualize a versao antes de criar a tag."
          }
          "VERSION=$ver" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-build.txt

      - name: Dependencias
        run: python -m pip install -r requirements.txt -r requirements-build.txt

      - name: Recursos Qt (pyrcc5)
        run: python -m PyQt5.pyrcc_main -o libs/resources.py resources.qrc

      - name: PyInstaller
        run: python -m PyInstaller labelImg.spec --noconfirm

      - name: Inno Setup 6
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
          }
          & $iscc "/DMyAppVersion=$env:VERSION" "installer\labelimg.iss"
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup falhou" }

      - name: Checksum SHA-256
        shell: pwsh
        run: |
          $nome = "LabelImg_Setup_$env:VERSION.exe"
          $hash = (Get-FileHash "installer\Output\$nome" -Algorithm SHA256).Hash.ToLower()
          "$hash  $nome" | Out-File -Encoding ascii "installer\Output\$nome.sha256"
          Write-Host "SHA-256: $hash"

      - name: Notas do release (mensagem da tag)
        shell: pwsh
        run: |
          git fetch --force --tags
          $notas = git tag -l --format='%(contents)' "${{ github.ref_name }}"
          if (-not $notas) { $notas = "LabelImg $env:VERSION" }
          $notas | Out-File -Encoding utf8 release_notes.md

      - name: Publicar release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: LabelImg ${{ env.VERSION }}
          body_path: release_notes.md
          files: |
            installer/Output/LabelImg_Setup_${{ env.VERSION }}.exe
            installer/Output/LabelImg_Setup_${{ env.VERSION }}.exe.sha256
